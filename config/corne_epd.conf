# Deep sleep after one hour idle (1*60*60*1000 ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 32 kHz crystal on the controller
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Display (e-paper status screen)
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_16=y

# USB manufacturer string (shows as "corne_epd" in macOS USB info)
CONFIG_USB_DEVICE_MANUFACTURER="corne_epd"

# Underglow (WS2812 strip, powered through ext-power)
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=80
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Max BLE transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# nRF52840 DC/DC: the nice_nano_v2 board turns on REG1 DC/DC by default.
# If the controller ever fails to boot or resets under load, turn it off:
# CONFIG_BOARD_ENABLE_DCDC=n
# High-voltage REG0 DC/DC stays off (nice_nano_v2 default).

# USB logging (debug only)
# CONFIG_ZMK_USB_LOGGING=y
